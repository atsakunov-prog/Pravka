# Слушалка: релизный APK на каждый пуш, публикация в ветку `apk-builds` —
# только из ветки `slushalka` и не трогая файлы Правки.
#
# `apk-builds` одна на репозиторий: один осиротевший коммит, в котором лежат
# файлы ОБОИХ приложений (Правка кладёт `pravka-debug.apk` + `build-info.txt`,
# Слушалка — `slushalka.apk` + `slushalka-build-info.txt`). Публикация сначала
# забирает то, что там уже есть, меняет только свои файлы и пушит новый
# одиночный коммит поверх с `--force-with-lease`. Если за это время ветку успела
# обновить вторая линия, push отвергается и попытка повторяется уже с её
# файлами — так две линии не затирают друг друга и не толкаются за ref
# (06.09 восемь одновременных публикаций падали с «cannot lock ref»).
#
# versionCode = github.run_number, общий на репозиторий: каждая следующая
# сборка ставится поверх предыдущей. Локальные сборки читают version.properties.
name: build-apk

on:
  push:
    branches: ["**"]
    paths-ignore: ["README.md", "CLAUDE.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build Слушалка (release)
        # Релизная, а не отладочная: отладочная помечена debuggable, и Play
        # Protect ругается на неё заметно охотнее. Ключ подписи тот же, поэтому
        # релиз спокойно встаёт поверх прежней отладочной.
        run: >-
          ./gradlew :slushalka:assembleRelease
          -PbuildNumber=${{ github.run_number }}
          --no-daemon

      - name: Publish to apk-builds (only from the slushalka line)
        if: github.ref_name == 'slushalka'
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_number }}
        run: |
          set -euo pipefail
          APK=slushalka/build/outputs/apk/release/slushalka-release.apk
          test -f "$APK"
          REMOTE="https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          PUB=/tmp/apkpub
          for attempt in 1 2 3 4 5; do
            rm -rf "$PUB"
            # Забираем то, что уже лежит в ветке (файлы Правки), и меняем только своё.
            if git clone -q --depth 1 --branch apk-builds "$REMOTE" "$PUB" 2>/dev/null; then
              BASE=$(git -C "$PUB" rev-parse HEAD)
            else
              mkdir -p "$PUB" && git -C "$PUB" init -q
              BASE=""
            fi
            cp "$APK" "$PUB/slushalka.apk"
            # Прежнее имя — для уже установленных копий, чей обновлятор знает только его.
            cp "$APK" "$PUB/slushalka-debug.apk"
            {
              echo "slushalka=1.1.${RUN}"
              echo "apk=slushalka.apk"
              echo "versionCode=${RUN}"
              echo "commit=${GITHUB_SHA}"
              echo "branch=${GITHUB_REF_NAME}"
              echo "builtAt=$(date -u +%Y-%m-%dT%H:%MZ)"
            } > "$PUB/slushalka-build-info.txt"
            # ПЕРЕХОДНОЕ — убрать, когда обе Слушалки (Саша и Марианна) обновятся
            # до 1.1.360+: старые копии читают общий build-info.txt. Правке этот
            # файл не страшен: у него branch=slushalka, и она его пропустит.
            cp "$PUB/slushalka-build-info.txt" "$PUB/build-info.txt"
            git -C "$PUB" config user.name "github-actions[bot]"
            git -C "$PUB" config user.email "github-actions[bot]@users.noreply.github.com"
            git -C "$PUB" checkout -q --orphan publish
            git -C "$PUB" add -A
            git -C "$PUB" commit -q -m "Слушалка ${RUN} from ${GITHUB_SHA::7} (файлы Правки — как были)"
            if [ -n "$BASE" ]; then
              LEASE="--force-with-lease=refs/heads/apk-builds:${BASE}"
            else
              LEASE="--force"
            fi
            if git -C "$PUB" push -q $LEASE "$REMOTE" HEAD:refs/heads/apk-builds; then
              echo "опубликовано (попытка $attempt)"
              exit 0
            fi
            echo "apk-builds ушла вперёд, попытка $attempt не прошла — повтор"
            sleep $((attempt * 5))
          done
          echo "не удалось опубликовать за 5 попыток"
          exit 1

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: slushalka-apk
          path: slushalka/build/outputs/apk/release/slushalka-release.apk
