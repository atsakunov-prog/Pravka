# Builds the signed debug APKs (Правка and Слушалка) on every push and
# publishes them to the orphan branch "apk-builds" (single force-pushed commit, so the repo
# does not grow). The development session fetches the APK from that
# branch and hands it to the owner.
#
# versionCode = github.run_number, so every CI build installs over the
# previous one. Local builds use the version.properties counter instead.
name: build-apk

on:
  push:
    branches: ["**"]
    paths-ignore: ["README.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build APKs
        # Слушалка собирается РЕЛИЗНОЙ: отладочная помечена debuggable, и
        # Play Protect ругается на неё заметно охотнее. Ключ подписи тот же,
        # поэтому релиз спокойно встаёт поверх прежней отладочной.
        run: >
          ./gradlew assembleDebug :slushalka:assembleRelease
          -PbuildNumber=${{ github.run_number }} --no-daemon

      - name: Publish APKs to apk-builds branch
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          SLU=slushalka/build/outputs/apk/release/slushalka-release.apk
          test -f "$APK"
          test -f "$SLU"
          mkdir /tmp/apkpub
          cp "$APK" /tmp/apkpub/pravka-debug.apk
          cp "$SLU" /tmp/apkpub/slushalka.apk
          # Прежнее имя оставлено для уже установленных копий: их обновлятор
          # умеет искать только его. Уберётся, когда оба телефона перешагнут.
          cp "$SLU" /tmp/apkpub/slushalka-debug.apk
          {
            echo "pravka=2.0.${{ github.run_number }}"
            echo "slushalka=1.0.${{ github.run_number }}"
            echo "apk=slushalka.apk"
            echo "versionCode=${{ github.run_number }}"
            echo "commit=${GITHUB_SHA}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "builtAt=$(date -u +%Y-%m-%dT%H:%MZ)"
          } > /tmp/apkpub/build-info.txt
          cd /tmp/apkpub
          git init -q -b apk-builds
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Debug APKs (Правка + Слушалка) ${{ github.run_number }} from ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk-builds

      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            slushalka/build/outputs/apk/release/slushalka-release.apk
