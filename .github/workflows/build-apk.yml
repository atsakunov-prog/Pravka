# Builds the signed debug APK on every push and publishes it to the
# orphan branch "apk-builds" (single force-pushed commit, so the repo
# does not grow). The development session fetches the APK from that
# branch and hands it to the owner.
#
# versionCode = github.run_number, so every CI build installs over the
# previous one. Local builds use the version.properties counter instead.
name: build-apk

on:
  push:
    branches: ["**"]
    paths-ignore: ["README.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build debug APK
        run: >-
          ./gradlew assembleDebug
          -PbuildNumber=${{ github.run_number }}
          -PbuildBranch=${{ github.ref_name }}
          --no-daemon

      - name: Publish APK to apk-builds branch
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          mkdir /tmp/apkpub
          cp "$APK" /tmp/apkpub/pravka-debug.apk
          {
            echo "pravka=2.0.${{ github.run_number }}"
            echo "versionName=2.0.${{ github.run_number }}"
            echo "apk=pravka-debug.apk"
            echo "versionCode=${{ github.run_number }}"
            echo "commit=${GITHUB_SHA}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "builtAt=$(date -u +%Y-%m-%dT%H:%MZ)"
          } > /tmp/apkpub/build-info.txt
          cd /tmp/apkpub
          git init -q -b apk-builds
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Pravka debug APK 1.0.${{ github.run_number }} from ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk-builds

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pravka-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
