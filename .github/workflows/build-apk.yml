# Builds the signed debug APK on every push and publishes it to the
# orphan branch "apk-builds" (single force-pushed commit, so the repo
# does not grow). The development session fetches the APK from that
# branch and hands it to the owner.
#
# versionCode = github.run_number, so every CI build installs over the
# previous one. Local builds use the version.properties counter instead.
name: build-apk

on:
  push:
    branches: ["**"]
    paths-ignore: ["README.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build debug APK
        run: ./gradlew assembleDebug -PbuildNumber=${{ github.run_number }} --no-daemon

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pravka-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
